name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Check JS mirrors (public/js)
        run: bash scripts/sync-public-js.sh --check

      - name: Critical source invariants
        run: bash scripts/check-critical-invariants.sh

      - name: Start Docker stack
        env:
          ADMIN_PASSWORD: ci-admin-password-2026
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:8081/api/bench-db-status.php?action=status"; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API not ready"
          docker compose logs --tail=80
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        working-directory: selenium-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API smoke tests
        working-directory: selenium-bot
        env:
          BASE_URL: http://localhost:8081
          ADMIN_PASSWORD: ci-admin-password-2026
        run: python run_bot.py --api-only

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-api-report
          path: selenium-bot/reports/report-latest.txt
          if-no-files-found: ignore
