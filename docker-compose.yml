# ТМ-07: калибровка и параметризация
# Запуск: docker compose up -d --build
# Сайт: http://localhost:8081
#
# OData 1С: ODATA_1C_HOST_IP в .env (см. .env.example)
name: tm07-bench

networks:
  bench:
    driver: bridge

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: dev.Dockerfile
    container_name: tm07-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/conf.d/bench-locations.inc:/etc/nginx/conf.d/bench-locations.inc:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/logs:/var/log/nginx
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    # HTTP :8081 и HTTPS :8443 в LAN. Хостовый 443 не публикуем.
    ports:
      - "${TM07_BIND_HOST:-0.0.0.0}:8081:80"
      - "${TM07_BIND_HOST:-0.0.0.0}:${TM07_HTTPS_PORT:-8443}:443"
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/api/bench-db-status.php?action=status | grep -q '\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - bench

  php:
    build:
      context: ./docker/php
      dockerfile: dev.Dockerfile
    container_name: tm07-php
    volumes:
      - ./src:/app
      - ./data:/app/data
      - ./firmware:/app/firmware:ro
      - ./database:/app/database:ro
      - ./.env:/app/.env:ro
    environment:
      - TZ=Europe/Moscow
      - COMPOSER_MEMORY_LIMIT=-1
      - HOME=/tmp
      - ODATA_1C_HOST_IP=${ODATA_1C_HOST_IP:-}
      - ODATA_1C_LAN_HOST=${ODATA_1C_LAN_HOST:-}
      - ODATA_1C_HTTP_HOST=${ODATA_1C_HTTP_HOST:-}
      - ODATA_1C_REPLACE_ANY_LAN_HOST=${ODATA_1C_REPLACE_ANY_LAN_HOST:-}
      - ODATA_1C_USER=${ODATA_1C_USER:-}
      - ODATA_1C_PASSWORD=${ODATA_1C_PASSWORD:-}
      - TM07_COUNTERS_SHEET_URL=${TM07_COUNTERS_SHEET_URL:-}
      - TM07_DB_DRIVER=${TM07_DB_DRIVER:-pgsql}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-tm07}
      - POSTGRES_USER=${POSTGRES_USER:-tm07}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tm07}
      - FIREBIRD_HOST=${FIREBIRD_HOST:-}
      - FIREBIRD_DATABASE=${FIREBIRD_DATABASE:-}
      - FIREBIRD_USER=${FIREBIRD_USER:-SYSDBA}
      - FIREBIRD_PASSWORD=${FIREBIRD_PASSWORD:-masterkey}
      - FIREBIRD_CHARSET=${FIREBIRD_CHARSET:-UTF8}
      - TM07_WORKSTATION_CODE=${TM07_WORKSTATION_CODE:-}
      - TM07_WORKSTATION_NAME=${TM07_WORKSTATION_NAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - BENCH_OPERATOR_PIN=${BENCH_OPERATOR_PIN:-}
      - OPERATOR_PIN=${OPERATOR_PIN:-}
      - BENCH_OPERATOR_PINS=${BENCH_OPERATOR_PINS:-}
      - BENCH_REQUIRE_OPERATOR_PIN=${BENCH_REQUIRE_OPERATOR_PIN:-}
      - TM07_PRINT_AGENT_TOKEN=${TM07_PRINT_AGENT_TOKEN:-}
      - TM07_REQUIRE_PRINT_AGENT_TOKEN=${TM07_REQUIRE_PRINT_AGENT_TOKEN:-}
      - TM07_SUPPLIER_LKG_HEX=${TM07_SUPPLIER_LKG_HEX:-}
      - TM07_CORR_LKG_HEX=${TM07_CORR_LKG_HEX:-}
      - TM07_MANUFACTURER_LKG_HEX=${TM07_MANUFACTURER_LKG_HEX:-}
      - TM07_FIRMWARE_DIR=${TM07_FIRMWARE_DIR:-/app/firmware}
      - TM07_SERIAL_XLSX=${TM07_SERIAL_XLSX:-/app/data/serial/Номера корректоров.xlsx}
      - TM07_SERIAL_XLSX_UNC=${TM07_SERIAL_XLSX_UNC:-\\\\srv-fs\\FileServer\\Production\\BD_Corrector\\Инструкция по выпуску корректоров\\Номера корректоров.xlsx}
      - TM07_SERIAL_AUTO_SYNC=${TM07_SERIAL_AUTO_SYNC:-1}
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
    command: ["bash", "-c", "php /app/api/cli-close-stale-sessions.php 24 2>/dev/null || true; exec docker-php-entrypoint php-fpm"]
    healthcheck:
      test: ["CMD-SHELL", "php /app/api/cli-health.php"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 25s
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
    networks:
      - bench

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: tm07-gotenberg
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    networks:
      - bench

  postgres:
    image: postgres:16-alpine
    container_name: tm07-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tm07}
      POSTGRES_USER: ${POSTGRES_USER:-tm07}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tm07}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tm07} -d ${POSTGRES_DB:-tm07}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bench
    # Host access for migrate scripts / psql (optional)
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"

volumes:
  postgres_data:
