<!DOCTYPE html>

    <style>
        @page { size: 58mm 20mm; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            font-family: "DejaVu Sans", Arial, Helvetica, sans-serif;
            color: #000;
            background: #fff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .plate {
            position: relative;
            width: 58mm;
            height: 20mm;
            background: #fff;
            overflow: hidden;
        }
        .logo {
            position: absolute;
            left: 2mm;
            top: 4.5mm;
            width: 26mm;
            height: 3.5mm;
            object-fit: contain;
            object-position: left center;
        }
        .title {
            position: absolute;
            left: 2mm;
            top: 8.2mm;
            width: 37mm;
            font-size: 7.1pt;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
        }
        .spec {
            position: absolute;
            left: 2mm;
            width: 37mm;
            font-size: 4.4pt;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
        }
        .spec1 { top: 11.4mm; }
        .spec2 { top: 13.65mm; }
        .spec3 { top: 15.9mm; }
        .bottom {
            position: absolute;
            top: 17.7mm;
            font-size: 6.1pt;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
        }
        .release {
            left: 2mm;
            width: 24mm;
        }
        .serial {
            left: 41.5mm;
            width: 16mm;
            text-align: center;
            font-family: "DejaVu Sans Mono", "Courier New", Courier, monospace;
        }
        .qr {
            position: absolute;
            left: 43mm;
            top: 4.8mm;
            width: 13mm;
            height: 13mm;
        }
        .qr img {
            display: block;
            width: 13mm !important;
            height: 13mm !important;
        }
        @media print {
            html, body { width: 58mm; height: 20mm; margin: 0; }
        }
        @media screen {
            html, body { width: auto; height: auto; min-height: 100vh; background: #ddd; }
            body { display: flex; align-items: flex-start; justify-content: center; padding: 24px; }
            .plate { box-shadow: 0 2px 10px rgba(0,0,0,.25); transform: scale(3.2); transform-origin: top center; }
        }
    </style>
</head>
