map $request_uri $loggable {
    "~^/\\?debugbar"    0;
    "~^/__hot-reload"  0;
    "~^/.well-known/appspecific/com.chrome.devtools.json"  0;
    default            1;
}

# HTTP в LAN оставляем доступным (иначе при проблемах с сертификатом сайт «не прогружается»).
# Для Web Serial (КАО) с другого ПК нужен HTTPS: https://IP:8443 + установленный CA.

server {
    listen 80;

    include /etc/nginx/conf.d/bench-locations.inc;
}

server {
    listen 443 ssl;
    # http2 off — совместимость с YaBrowser/локальным CA

    # fullchain = prod.crt + ca.crt — иначе браузеры часто «не прогружают» HTTPS
    ssl_certificate     /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/prod.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_stapling off;
    ssl_stapling_verify off;

    # Если открыли http://IP:8443 (без s) — поднять на https://IP:8443 (нужно для Web Serial)
    error_page 497 =301 https://$host:8443$request_uri;

    # Корневой CA для установки на рабочие ПК (скачать после первого входа)
    location = /bench-ca.crt {
        alias /etc/nginx/ssl/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="tm07-bench-ca.crt"';
        access_log off;
    }

    include /etc/nginx/conf.d/bench-locations.inc;
}
